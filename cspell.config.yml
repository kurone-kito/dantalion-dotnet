allowCompoundWords: true
dictionaries:
  - cpp
  - csharp
  - dotnet
  - en-gb
  - en-us
  - game-development
  - gaming-terms
  - softwareTerms
  - unity
enableGlobDot: true
features:
  weighted-suggestions: true
globRoot: ${cwd}
ignorePaths:
  - .git
  - .github/CODE_OF_CONDUCT.*
  - .vscode/extensions.json
  - Assets/UdonSharp
  - Assets/XR
  - cspell.config.yml
  - Packages/com.*
  - Packages/dev.*
  - Packages/*.json
  - ProjectSettings
ignoreRegExpList:
  - (avtr|wrld)_([0-9a-f]{8})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{12})
language: en,ja
useGitignore: true
version: "0.2"
words:
  - alcom
  - dwlt
  - kito
  - kuroné
  - msaa
  - nunit
  - scriban
  - spatialize
  - udon
  - unityyamlmerge
  - vrchat
  - vrcsdk
  - vstuc
